name: Build and deploy React (Vite) app to Azure Web App - unac-meli-front

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      # ----------------------------
      # Checkout
      # ----------------------------
      - uses: actions/checkout@v4

      # ----------------------------
      # Node setup
      # ----------------------------
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'

      # ----------------------------
      # Install dependencies
      # ----------------------------
      - name: Install dependencies
        run: npm install

      # ----------------------------
      # Build React (Vite)
      # ----------------------------
      - name: Build project
        run: npm run build

      # ----------------------------
      # Zip dist content (NOT the folder)
      # ----------------------------
      - name: Zip dist folder
        run: |
          cd dist
          zip -r ../dist.zip .
          cd ..

      # ----------------------------
      # Azure Login (OIDC)
      # ----------------------------
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_DE4A8522E98147F5BC074B1A2EE0E559 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_9281BDB3321C45E0B770601155A6251E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D990230CF0BE48EDB46238E541776361 }}

      # ----------------------------
      # Deploy to Azure App Service
      # ----------------------------
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: unac-meli-front
          slot-name: Production
          package: dist.zip
